<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#060810">
    <title>AL BEZAM GROUP</title>

    <meta name="description" content="AL BEZAM GROUP — official website coming soon.">
    <meta name="robots" content="noindex, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="AL BEZAM GROUP">
    <meta property="og:url" content="https://albezam.ae">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">

    <style>
        :root {
            --navy: #060810;
            --cyan: #00BFA5;
            --white: #FFFFFF;
            --text-grey: #8696A9;
            --font-display: 'Space Grotesk', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            background: var(--navy);
            color: var(--white);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 32px;
            background-image:
                radial-gradient(600px circle at 50% 30%, rgba(0, 191, 165, .08), transparent 65%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .mark {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--cyan);
            color: var(--navy);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 26px;
            display: grid;
            place-items: center;
            letter-spacing: -.02em;
            margin-bottom: 32px;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(36px, 6vw, 64px);
            line-height: 1.1;
            letter-spacing: -.01em;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 15px;
            color: var(--text-grey);
            letter-spacing: .02em;
            margin-bottom: 48px;
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .contacts a {
            color: var(--white);
            text-decoration: none;
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 17px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .08);
            transition: border-color .15s, color .15s, background .15s;
        }

        .contacts a:hover {
            color: var(--cyan);
            border-color: var(--cyan);
            background: rgba(0, 191, 165, .05);
        }

        footer {
            margin-top: 64px;
            font-size: 12px;
            color: var(--text-grey);
            letter-spacing: .04em;
        }
    </style>
</head>

<body>
    <div class="mark" aria-hidden="true">AB</div>
    <h1>AL BEZAM GROUP</h1>
    <p class="tag">Website under development</p>

    <div class="contacts">
        <a href="mailto:is@albezam.ae">is@albezam.ae</a>
        <a href="mailto:info@albezam.ae">info@albezam.ae</a>
    </div>

    <footer>© <span id="year"></span> AL BEZAM GROUP</footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
